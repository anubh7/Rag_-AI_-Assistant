<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RAG AI Assistant</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(30, 41, 59, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --error-color: #f87171;
      --success-color: #4ade80;
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    .login-scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      perspective: 900px;
    }

    .login-orb {
      position: absolute;
      border-radius: 42% 58% 63% 37% / 45% 44% 56% 55%;
      transform-style: preserve-3d;
      box-shadow:
        inset -22px -25px 42px rgba(2, 6, 23, 0.42),
        inset 18px 15px 30px rgba(255, 255, 255, 0.22),
        0 28px 60px rgba(2, 6, 23, 0.42);
      animation: login-float 12s ease-in-out infinite alternate;
    }

    .login-orb-main {
      width: 230px;
      height: 230px;
      top: 9%;
      left: 13%;
      opacity: 0.75;
      background: linear-gradient(135deg, #22d3ee 5%, #2563eb 58%, #312e81);
    }

    .login-orb-small {
      width: 105px;
      height: 105px;
      right: 16%;
      bottom: 18%;
      opacity: 0.82;
      background: linear-gradient(135deg, #f0abfc, #a855f7 58%, #4c1d95);
      animation-delay: -4s;
    }

    .login-orb-pink {
      width: 72px;
      height: 72px;
      left: 28%;
      bottom: 16%;
      opacity: 0.8;
      background: linear-gradient(135deg, #fda4af, #db2777 60%, #500724);
      animation-delay: -8s;
    }

    .login-ring {
      position: absolute;
      width: 350px;
      height: 350px;
      left: 4%;
      top: 3%;
      border: 1px solid rgba(103, 232, 249, 0.22);
      border-radius: 50%;
      transform: rotateX(65deg) rotateZ(-28deg);
      box-shadow:
        0 0 0 18px rgba(103, 232, 249, 0.035),
        0 0 0 38px rgba(103, 232, 249, 0.025),
        0 0 0 58px rgba(103, 232, 249, 0.015);
      animation: login-spin 22s linear infinite;
    }

    .login-grid {
      position: absolute;
      right: -40px;
      bottom: 8%;
      width: 310px;
      height: 220px;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(196, 181, 253, 0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(196, 181, 253, 0.45) 1px, transparent 1px);
      background-size: 26px 26px;
      transform: perspective(500px) rotateX(62deg) rotateZ(-12deg);
      mask-image: linear-gradient(to bottom, transparent, #000 35%, transparent);
      animation: login-grid-drift 9s ease-in-out infinite alternate;
    }

    .bot-mascot {
      position: absolute;
      right: 12%;
      top: 18%;
      width: 170px;
      height: 190px;
      transform-style: preserve-3d;
      animation: bot-hover 4.5s ease-in-out infinite;
      filter: drop-shadow(0 28px 18px rgba(2, 6, 23, 0.42));
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
    }

    .bot-mascot::after {
      content: "";
      position: absolute;
      inset: -18px;
      border: 1px solid rgba(103, 232, 249, 0);
      border-radius: 46%;
      transform: scale(0.7);
      opacity: 0;
    }

    .bot-mascot.is-excited {
      animation: bot-excited 0.85s cubic-bezier(.2, .8, .2, 1);
    }

    .bot-mascot.is-excited::after {
      animation: bot-ripple 0.85s ease-out;
    }

    .bot-mascot.is-excited .bot-arm-left {
      animation: bot-wave-left 0.85s ease-in-out;
    }

    .bot-mascot.is-excited .bot-arm-right {
      animation: bot-wave-right 0.85s ease-in-out;
    }

    .bot-mascot.is-excited .bot-eye {
      animation: bot-happy-eyes 0.85s ease-in-out;
    }

    .bot-mascot.is-excited .bot-body::before {
      animation: bot-heart 0.85s ease-in-out;
    }

    .bot-antenna {
      position: absolute;
      top: 0;
      left: 82px;
      width: 6px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(#67e8f9, #6366f1);
      box-shadow: 0 0 16px #22d3ee;
    }

    .bot-antenna::before {
      content: "";
      position: absolute;
      top: -9px;
      left: -5px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #a5f3fc;
      box-shadow: 0 0 20px #22d3ee;
      animation: bot-blink 2s ease-in-out infinite;
    }

    .bot-head {
      position: absolute;
      top: 24px;
      left: 19px;
      width: 132px;
      height: 92px;
      border: 2px solid rgba(165, 243, 252, 0.65);
      border-radius: 38px 38px 30px 30px;
      background: linear-gradient(145deg, rgba(125, 211, 252, 0.9), rgba(79, 70, 229, 0.86) 62%, rgba(30, 27, 75, 0.95));
      box-shadow: inset -15px -13px 20px rgba(15, 23, 42, 0.5), inset 10px 9px 15px rgba(255, 255, 255, 0.28), 0 14px 25px rgba(37, 99, 235, 0.3);
      transform: rotateX(8deg) rotateY(-12deg);
    }

    .bot-face {
      position: absolute;
      inset: 17px 13px;
      border-radius: 25px;
      background: linear-gradient(135deg, #07152f, #111827);
      border: 1px solid rgba(103, 232, 249, 0.4);
      box-shadow: inset 0 0 22px rgba(34, 211, 238, 0.16);
    }

    .bot-eye {
      position: absolute;
      top: 29px;
      width: 14px;
      height: 20px;
      border-radius: 50%;
      background: #67e8f9;
      box-shadow: 0 0 15px #22d3ee;
      animation: bot-blink 3.2s ease-in-out infinite;
    }

    .bot-eye-left { left: 27px; }
    .bot-eye-right { right: 27px; animation-delay: 0.1s; }

    .bot-mouth {
      position: absolute;
      left: 43px;
      bottom: 17px;
      width: 30px;
      height: 8px;
      border-bottom: 2px solid #a5f3fc;
      border-radius: 50%;
    }

    .bot-body {
      position: absolute;
      left: 37px;
      top: 115px;
      width: 100px;
      height: 62px;
      border: 2px solid rgba(196, 181, 253, 0.5);
      border-radius: 26px 26px 18px 18px;
      background: linear-gradient(145deg, #8b5cf6, #312e81 70%);
      box-shadow: inset -12px -10px 20px rgba(15, 23, 42, 0.5), inset 8px 7px 12px rgba(255, 255, 255, 0.18), 0 12px 20px rgba(76, 29, 149, 0.3);
      transform: rotateX(8deg);
    }

    .bot-body::before {
      content: "✦";
      position: absolute;
      left: 40px;
      top: 17px;
      color: #a5f3fc;
      font-size: 22px;
      text-shadow: 0 0 14px #22d3ee;
    }

    .bot-arm {
      position: absolute;
      top: 125px;
      width: 18px;
      height: 49px;
      border-radius: 15px;
      background: linear-gradient(#67e8f9, #4f46e5);
      box-shadow: 0 8px 14px rgba(37, 99, 235, 0.25);
    }

    .bot-arm-left { left: 18px; transform: rotate(20deg); }
    .bot-arm-right { right: 18px; transform: rotate(-20deg); }

    @keyframes bot-hover {
      0%, 100% { transform: translateY(0) rotateY(-8deg) rotateZ(-2deg); }
      50% { transform: translateY(-16px) rotateY(8deg) rotateZ(2deg); }
    }

    @keyframes bot-excited {
      0% { transform: translateY(0) rotateZ(0) scale(1); }
      25% { transform: translateY(-22px) rotateZ(-8deg) scale(1.08); }
      50% { transform: translateY(-6px) rotateZ(8deg) scale(1.04); }
      75% { transform: translateY(-18px) rotateZ(-4deg) scale(1.06); }
      100% { transform: translateY(0) rotateZ(0) scale(1); }
    }

    @keyframes bot-ripple {
      0% { opacity: 0.65; transform: scale(0.7); border-color: rgba(103, 232, 249, 0.65); }
      100% { opacity: 0; transform: scale(1.35); border-color: rgba(167, 139, 250, 0); }
    }

    @keyframes bot-wave-left {
      50% { transform: rotate(48deg) translateY(-8px); }
    }

    @keyframes bot-wave-right {
      50% { transform: rotate(-48deg) translateY(-8px); }
    }

    @keyframes bot-happy-eyes {
      50% { transform: scaleY(0.2) scaleX(1.2); background: #f0abfc; }
    }

    @keyframes bot-heart {
      50% { transform: scale(1.35); color: #f0abfc; text-shadow: 0 0 24px #f0abfc; }
    }

    @keyframes bot-blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); opacity: 1; }
      46% { transform: scaleY(0.12); opacity: 0.6; }
    }

    @keyframes login-float {
      0% { transform: translate3d(-16px, 12px, 0) rotate(-9deg) scale(0.94); }
      100% { transform: translate3d(20px, -20px, 80px) rotate(16deg) scale(1.08); }
    }

    @keyframes login-spin {
      to { transform: rotateX(65deg) rotateZ(332deg); }
    }

    @keyframes login-grid-drift {
      to { transform: perspective(500px) rotateX(62deg) rotateZ(-5deg) translateY(-16px); }
    }

    /* Animated background glows */
    body::before, body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--primary);
      filter: blur(120px);
      opacity: 0.15;
      z-index: 0;
    }

    body::before {
      top: 15%;
      left: 20%;
    }

    body::after {
      bottom: 15%;
      right: 20%;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .brand-symbol {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border: 1px solid rgba(103, 232, 249, 0.42);
      border-radius: 17px;
      color: #67e8f9;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(124, 58, 237, 0.34));
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.2), inset 0 1px rgba(255, 255, 255, 0.22);
      font-size: 27px;
      animation: symbol-pulse 3s ease-in-out infinite;
    }

    @keyframes symbol-pulse {
      50% { transform: translateY(-4px) rotate(4deg); box-shadow: 0 0 42px rgba(34, 211, 238, 0.3), inset 0 1px rgba(255, 255, 255, 0.3); }
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .toggle-text {
      margin-top: 25px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .toggle-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-link:hover {
      text-decoration: underline;
    }

    /* Status Alerts */
    .alert {
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }

    .alert-error {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--error-color);
    }

    .alert-success {
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--success-color);
    }

    @media (max-width: 700px) {
      .login-orb-main { left: -80px; top: 3%; }
      .login-ring { left: -130px; top: -30px; }
      .login-grid { right: -100px; }
      .login-orb-small { right: -20px; bottom: 8%; }
      .bot-mascot { right: -30px; top: 7%; transform: scale(0.7); }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-orb, .login-ring, .login-grid, .brand-symbol, .bot-mascot, .bot-eye, .bot-antenna::before { animation: none; }
    }
  </style>
</head>
<body>

  <div class="login-scene" aria-hidden="true">
    <div class="login-orb login-orb-main"></div>
    <div class="login-orb login-orb-small"></div>
    <div class="login-orb login-orb-pink"></div>
    <div class="login-ring"></div>
    <div class="login-grid"></div>
    <div class="bot-mascot">
      <div class="bot-antenna"></div>
      <div class="bot-head">
        <div class="bot-face">
          <span class="bot-eye bot-eye-left"></span>
          <span class="bot-eye bot-eye-right"></span>
          <span class="bot-mouth"></span>
        </div>
      </div>
      <div class="bot-arm bot-arm-left"></div>
      <div class="bot-arm bot-arm-right"></div>
      <div class="bot-body"></div>
    </div>
  </div>

  <div class="container">
    <div class="glass-card">
      <div class="brand-symbol">✦</div>
      <h2 id="form-title">Welcome Back</h2>
      <p class="subtitle" id="form-subtitle">Sign in to access your RAG Assistant</p>

      <div id="alert-box" class="alert"></div>

      <form id="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="submit-btn">Sign In</button>
      </form>

      <p class="toggle-text">
        <span id="toggle-desc">Don't have an account?</span>
        <span class="toggle-link" id="toggle-mode-btn">Register</span>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    let isLoginMode = true;

    // Elements
    const formTitle = document.getElementById("form-title");
    const formSubtitle = document.getElementById("form-subtitle");
    const authForm = document.getElementById("auth-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const toggleDesc = document.getElementById("toggle-desc");
    const toggleModeBtn = document.getElementById("toggle-mode-btn");
    const alertBox = document.getElementById("alert-box");
    const botMascot = document.querySelector(".bot-mascot");

    botMascot.addEventListener("click", () => {
      botMascot.classList.remove("is-excited");
      void botMascot.offsetWidth;
      botMascot.classList.add("is-excited");
      window.setTimeout(() => botMascot.classList.remove("is-excited"), 900);
    });

    // Toggle Mode
    toggleModeBtn.addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      alertBox.style.display = "none";
      authForm.reset();

      if (isLoginMode) {
        formTitle.textContent = "Welcome Back";
        formSubtitle.textContent = "Sign in to access your RAG Assistant";
        submitBtn.textContent = "Sign In";
        toggleDesc.textContent = "Don't have an account?";
        toggleModeBtn.textContent = "Register";
        passwordInput.placeholder = "Enter your password";
      } else {
        formTitle.textContent = "Create Account";
        formSubtitle.textContent = "Sign up to start chatting with your docs";
        submitBtn.textContent = "Register";
        toggleDesc.textContent = "Already have an account?";
        toggleModeBtn.textContent = "Sign In";
        passwordInput.placeholder = "Choose a strong password (min 6 chars)";
      }
    });

    // Form Submit Handler
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) return;

      if (!isLoginMode && password.length < 6) {
        showAlert("error", "Password must be at least 6 characters long.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = isLoginMode ? "Signing In..." : "Registering...";

      try {
        const endpoint = isLoginMode ? "/auth/login" : "/auth/register";
        const response = await fetch(`${API_BASE}${endpoint}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok && result.status === "success") {
          if (isLoginMode) {
            // Save token info
            localStorage.setItem("access_token", result.data.access_token);
            localStorage.setItem("username", result.data.username);
            localStorage.setItem("role", result.data.role);
            
            showAlert("success", "Login successful! Redirecting...");
            setTimeout(() => {
              window.location.href = "index.html";
            }, 1000);
          } else {
            showAlert("success", "Registration successful! You can now log in.");
            setTimeout(() => {
              toggleModeBtn.click(); // Switch to login mode
            }, 1500);
          }
        } else {
          showAlert("error", result.detail || result.message || "An error occurred during authentication.");
        }
      } catch (err) {
        console.error("Auth error:", err);
        showAlert("error", "Failed to connect to the backend server. Please verify it is running.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? "Sign In" : "Register";
      }
    });

    function showAlert(type, message) {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
    }

    // Direct redirection if already logged in
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("access_token");
      if (token) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
